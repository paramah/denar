version: "3"

vars:
  # Nadpisz, np. COMPOSE="podman compose" task compose:up
  COMPOSE: '{{.COMPOSE | default "docker compose"}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

includes:
  # Web UI (etap 007): web:install, web:types, web:types:check, web:build,
  # web:test, web:e2e, web:dev.
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web

tasks:
  build:
    desc: Buduje binarium denar (z osadzonym Web UI, jeśli zbudowane)
    deps: [web:build]
    cmds:
      - go build -ldflags {{printf "-X main.version=%s" .VERSION | shellQuote}} -o denar ./cmd/denar

  test:
    desc: Uruchamia testy z detektorem wyścigów
    cmds:
      - go test -race ./...

  vet:
    desc: Uruchamia go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Sprawdza formatowanie gofmt
    cmds:
      - cmd: |
          files="$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            echo "run gofmt -w on the files above"
            exit 1
          fi
        silent: true

  generate:
    desc: Regeneruje kod z api/openapi.yaml (oapi-codegen)
    cmds:
      - go generate ./...

  verify:
    desc: Format, vet, Web UI (build i testy), testy Go i build
    cmds:
      - task: fmt
      - task: vet
      - task: web:build
      - task: web:test
      - task: test
      - task: build

  migrate:
    desc: Migruje bazę z konfiguracją z .env.dev
    dotenv: [".env.dev"]
    cmds:
      - mkdir -p .dev
      - go run ./cmd/denar migrate

  run:
    desc: Buduje i uruchamia serwer (konfiguracja ze zmiennych DENAR_*)
    deps: [build]
    cmds:
      - ./denar serve

  dev:api:
    desc: Uruchamia serwer API z konfiguracją z .env.dev
    dotenv: [".env.dev"]
    preconditions:
      - sh: test -f .env.dev
        msg: "Brak pliku .env.dev; skopiuj .env.dev.example do .env.dev i ustaw hasło"
    cmds:
      - mkdir -p .dev
      - go run ./cmd/denar serve

  dev:
    desc: Rozwój — API (task dev:api) i Vite na :5173 (task web:dev) naraz
    deps: [dev:api, web:dev]

  demo:
    desc: "Lokalne demo: buduje, seeduje .dev/demo.db (konto demo@denar.local) i uruchamia serwer na :8080"
    deps: [build]
    env:
      DENAR_DB: .dev/demo.db
      DENAR_ADDR: '{{.DEMO_ADDR | default ":8080"}}'
      DENAR_BASE_URL: '{{.DEMO_BASE_URL | default "http://localhost:8080"}}'
      DENAR_MASTER_KEY: ""
      DENAR_MASTER_KEY_FILE: .dev/master.key
      DENAR_INSTANCE_NAME: Denar (demo)
      DENAR_AUTO_MIGRATE: "true"
      DENAR_LOCAL_LOGIN: "true"
      # Konto demo tworzy `denar demo`; konto startowe z otoczenia pominięte.
      DENAR_ADMIN_EMAIL: ""
      DENAR_ADMIN_PASSWORD: ""
      DENAR_ADMIN_PASSWORD_FILE: ""
      DENAR_OIDC_ISSUER: ""
      # Lokalnie wolno wysłać webhook do n8n/ntfy na tym komputerze (009, SSRF).
      DENAR_NOTIFY_ALLOW_PRIVATE: "true"
      DENAR_DEV_FAKE_CONNECTOR: "true"
    cmds:
      - mkdir -p .dev
      - cmd: |
          if [ ! -s .dev/master.key ]; then
            openssl rand -base64 32 > .dev/master.key
            chmod 600 .dev/master.key
            echo "Wygenerowano klucz deweloperski .dev/master.key"
          fi
        silent: true
      - ./denar demo --reset
      - ./denar serve

  compose:up:
    desc: Buduje obraz i uruchamia kontener (wymaga pliku .env)
    cmds:
      - "{{.COMPOSE}} up --build --detach --wait"

  compose:down:
    desc: Zatrzymuje kontener; dane zostają w wolumenie denar-data
    cmds:
      - "{{.COMPOSE}} down"

  compose:logs:
    desc: Pokazuje logi kontenera
    cmds:
      - "{{.COMPOSE}} logs --follow"
