name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks before publishing a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository contract suites and the end-to-end tests of cmd/denar
    # run on PostgreSQL as well (014-postgres).
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: denar
          POSTGRES_PASSWORD: denar
          POSTGRES_DB: denar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denar"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DENAR_TEST_POSTGRES: postgres://denar:denar@localhost:5432/denar?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Install web dependencies
        run: task web:install

      - name: Check generated API types
        run: task web:types:check

      # gofmt, go vet, web build + tests, go test -race (contract suites on
      # SQLite and PostgreSQL), go build
      - name: Verify
        run: task verify

      - name: End-to-end tests on PostgreSQL
        run: task test:e2e:postgres

  # Builds the release image (one platform, not pushed), so a broken
  # Dockerfile shows up in the pull request, not in the release.
  image:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Install web dependencies
        run: task web:install

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # task web:e2e depends on `task build` (web build + go build with the
      # embedded UI) and runs Playwright against ./denar, so no separate build step.
      - name: E2E tests
        run: task web:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/node_modules/.e2e/report
            web/node_modules/.e2e/results
          include-hidden-files: true
          retention-days: 14
