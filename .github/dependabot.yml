version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # "typescript" is the TS 6 API for typescript-eslint (see web/package.json);
      # tsc itself is TS 7 under the @typescript/native alias. Lift once
      # typescript-eslint supports TS 7: typescript-eslint/typescript-eslint#10940.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node describes the Node.js runtime, so its major follows
      # web/.nvmrc (and the node image in the Dockerfile); bump them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "@eslint-react/*", "typescript-eslint", "globals"]
      typescript:
        patterns: ["typescript", "@typescript/*"]
      test:
        patterns: ["vitest", "@testing-library/*", "jsdom", "msw", "@playwright/test", "@axe-core/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The node major follows web/.nvmrc and moves together with it, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
