components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: denar_session
    bot:
      type: http
      scheme: bearer
      description: Token bota dnr_…
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string }
    BotId:
      name: botId
      in: path
      required: true
      schema: { type: string }
    WalletId:
      name: walletId
      in: path
      required: true
      schema: { type: string }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string }
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    EnvelopeId:
      name: envelopeId
      in: path
      required: true
      schema: { type: string }
    Month:
      name: month
      in: path
      required: true
      description: Miesiąc budżetowy YYYY-MM (2000-01…2100-12)
      schema: { type: string, examples: ["2026-10"] }
  responses:
    Problem:
      description: Błąd w formacie RFC 7807
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Za dużo prób; ponów po Retry-After sekundach
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: "URI rodzaju błędu, np. urn:denar:problem:last-owner" }
        code:
          type: string
          enum: [bad_request, validation, unauthenticated, forbidden, not_found, conflict, rate_limited, internal]
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          description: Błędy walidacji pól (dla 422)
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    AuthConfig:
      type: object
      required: [oidc_enabled, local_login, instance_name, version]
      properties:
        oidc_enabled: { type: boolean }
        local_login: { type: boolean }
        instance_name: { type: string }
        version: { type: string }
    LocalLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    User:
      type: object
      required: [id, email, name, instance_admin, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        instance_admin: { type: boolean, description: Konto startowe instancji (narzędzia CLI) }
        created_at: { type: string, format: date-time }
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    Me:
      type: object
      required: [kind, households]
      properties:
        kind: { type: string, enum: [user, bot] }
        user: { $ref: "#/components/schemas/User" }
        bot: { $ref: "#/components/schemas/Bot" }
        households:
          type: array
          description: Gospodarstwa z rolą (bot — własne, z rolą twórcy)
          items: { $ref: "#/components/schemas/Household" }
    Currency:
      type: object
      required: [code, decimals]
      properties:
        code: { type: string, description: Kod ISO 4217 }
        decimals: { type: integer, description: Liczba miejsc jednostki minimalnej }
    CurrencyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Currency" }
    Household:
      type: object
      required: [id, name, base_currency, timezone, month_start_day, created_at, role]
      properties:
        id: { type: string }
        name: { type: string }
        base_currency: { type: string, description: Kod ISO 4217; niezmienny }
        timezone: { type: string, description: Strefa IANA, np. Europe/Warsaw }
