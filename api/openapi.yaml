        activity: { $ref: "#/components/schemas/Money" }
        available: { $ref: "#/components/schemas/Money" }
        envelopes:
          type: array
          items: { $ref: "#/components/schemas/BudgetEnvelope" }
    BudgetMonth:
      type: object
      description: |
        Inwariant: Σ available wszystkich kopert + ready_to_assign + assigned_in_future = Σ kwot bazowych transakcji
        portfeli on-budget z datą ≤ end (bez rate_pending).
      required: [month, start, end, currency, ready_to_assign, assigned_in_future, overspent_last_month, income,
        uncategorized, transfers, assigned, activity, available, underfunded, incomplete, pending_transactions, groups]
      properties:
        month: { type: string, examples: ["2026-10"] }
        start: { type: string, format: date }
        end: { type: string, format: date }
        currency: { type: string, description: Waluta bazowa gospodarstwa }
        ready_to_assign: { description: Już pomniejszone o assigned_in_future, $ref: "#/components/schemas/Money" }
        assigned_in_future: { $ref: "#/components/schemas/Money" }
