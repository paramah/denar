openapi: 3.1.0
info:
  title: denar REST API
  version: 0.1.0
  description: |
    Kontrakt REST Denara (etapy 001-core, 002-wallets-transactions, 003-envelope-budget). Źródło typów Go (oapi-codegen) i TS
    (openapi-typescript, etap 007).

    Uwierzytelnianie: sesja w cookie `denar_session` (logowanie hasłem lub
    OIDC) albo token bota w nagłówku `Authorization: Bearer dnr_…`. Żądanie
    z cookie i Bearer naraz dostaje 400 (code bad_request). Każda operacja
    poza publicznymi może zwrócić 401. Bot przekraczający limit żądań
    (DENAR_BOT_RATE na minutę) i adres z nadmiarem nieudanych prób Bearer
    dostają 429 z nagłówkiem Retry-After. Żądanie zmieniające stan wysłane
    przez przeglądarkę z innego originu dostaje 403. Te trzy odpowiedzi
    dotyczą każdej operacji i nie są powtarzane przy każdej z nich.

    Błędy mają format RFC 7807/9457 (application/problem+json) z polem code;
    powód 403 i 409 jest ostatnim segmentem type (urn:denar:problem:<powód>):
    human-only, role, scope (403); last-owner, already-member,
    duplicate-email, duplicate-name, invitation-used, invitation-expired
    (409).

    Zasoby gospodarstwa leżą pod /households/{householdId}. Gospodarstwo,
    w którym nie ma się członkostwa (bot: inne niż jego własne), daje 404,
    tak jak nieistniejące. Bot nie wykonuje operacji administracyjnych
    (członkowie, zaproszenia, boty, ustawienia, audyt): 403 human-only.
    Jawny token bota wraca tylko w odpowiedziach createBot i rotateBotToken
    (z Cache-Control: no-store). Token zaproszenia wraca tylko w
    createInvitation; link ma postać <DENAR_BASE_URL>/invite#<token>, a
    aplikacja przekazuje token w body operacji /invitations/*.

    Listy stronicowane przyjmują cursor i limit (domyślnie 50, maks. 200)
    i zwracają next_cursor (null na ostatniej stronie).

    Kwoty (etap 002) to obiekty Money {amount: "-12.34", currency: "PLN",
    minor: -1234} — amount jest stringiem dziesiętnym z liczbą miejsc
    waluty; na wejściu MoneyInput {amount, currency}, gdzie waluta musi być
    walutą portfela. Portfel prywatny, którego wywołujący nie widzi (także
    owner), i portfel spoza listy bota dają 404. Dodatkowe powody 403:
    wallet (druga noga przelewu w niewidocznym portfelu); 409:
    duplicate-external-id, wallet-archived.

    Budżet kopertowy (etap 003) leży pod /households/{householdId}/budget.
    Kwoty budżetu są w walucie bazowej gospodarstwa (MoneyInput w innej
    walucie daje 422). Miesiąc budżetowy {month} to YYYY-MM miesiąca
    kalendarzowego, w którym się zaczyna (wg month_start_day). Sumy budżetu
    obejmują wszystkie portfele on-budget gospodarstwa, także prywatne
    portfele innych osób i portfele spoza listy bota; lista transakcji
    koperty pokazuje tylko widoczne portfele i wymaga też transactions:read.
    Odczyt wymaga budget:read, zmiany budget:write. Dodatkowe powody 409:
    group-not-empty, envelope-in-use.
servers:
  - url: /api
security:
  - session: []
  - bot: []
tags:
  - name: auth
  - name: me
  - name: households
  - name: members
  - name: invitations
  - name: bots
  - name: audit
  - name: wallets
  - name: transactions
  - name: payees
  - name: fx
  - name: budget

paths:
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Co jest włączone na instancji (dla ekranu logowania)
      security: []
      responses:
        "200":
          description: Konfiguracja logowania
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/login:
    get:
      tags: [auth]
      operationId: loginStart
      summary: Rozpoczyna logowanie OIDC (Authorization Code + PKCE)
      security: []
      parameters:
        - name: return_to
          in: query
          description: Ścieżka w aplikacji, na którą wrócić po zalogowaniu
          schema: { type: string }
      responses:
        "302": { description: Przekierowanie do dostawcy OIDC }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [auth]
      operationId: loginLocal
      summary: Logowanie e-mailem i hasłem; ustawia cookie sesji
      description: |
        Błędne dane, nieznane konto i wyłączone logowanie lokalne dają tę samą
        odpowiedź 401. Po przekroczeniu limitu nieudanych prób (na adres i na
        e-mail) 429 z Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalLogin" }
      responses:
        "200":
          description: Zalogowano, sesja w cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/callback:
    get:
      tags: [auth]
      operationId: loginCallback
      summary: Powrót od dostawcy OIDC
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, description: Ustawiane przez dostawcę przy odmowie, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302": { description: Zalogowano, przekierowanie do aplikacji }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Kończy sesję; bez ważnej sesji też odpowiada 204
      security: []
      responses:
        "204": { description: Wylogowano }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Kim jest wywołujący — człowiek z gospodarstwami albo bot z uprawnieniami
      responses:
        "200":
          description: Zalogowany użytkownik albo bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
  /currencies:
    get:
      tags: [me]
      operationId: listCurrencies
      summary: Obsługiwane waluty ISO 4217 z liczbą miejsc dziesiętnych
      responses:
        "200":
          description: Waluty według kodu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrencyList" }
        "401": { $ref: "#/components/responses/Problem" }

  /households:
    get:
      tags: [households]
      operationId: listHouseholds
      summary: Gospodarstwa wywołującego (bot — tylko własne)
      responses:
        "200":
          description: Gospodarstwa z rolą wywołującego
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [households]
      operationId: createHousehold
      summary: Zakłada gospodarstwo; twórca zostaje ownerem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdCreate" }
      responses:
        "201":
          description: Utworzone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [households]
      operationId: getHousehold
      responses:
        "200":
          description: Gospodarstwo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [households]
      operationId: updateHousehold
      summary: Zmienia nazwę, strefę czasową lub dzień startu miesiąca (owner, admin)
      description: Waluty bazowej nie można zmienić.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdUpdate" }
      responses:
        "200":
          description: Zmienione
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [households]
      operationId: deleteHousehold
      summary: Usuwa gospodarstwo z członkostwami, zaproszeniami, botami i audytem (owner)
      responses:
        "204": { description: Usunięte }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /households/{householdId}/members:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [members]
      operationId: listMembers
      responses:
        "200":
          description: Członkowie od najdawniejszego
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [members]
      operationId: updateMember
      summary: Zmienia rolę członka
      description: |
        Owner zmienia każdą rolę; admin nie nadaje, nie odbiera i nie zmienia
        roli owner (403 role). Ostatniego ownera nie można zdegradować (409
        last-owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Zmieniony członek
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Usuwa członka lub pozwala odejść samemu; wyłącza boty, których członek jest twórcą
      responses:
        "204": { description: Usunięty }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Zaproszenia od najnowszego (owner, admin)
      responses:
        "200":
          description: Zaproszenia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Zaprasza e-mail z rolą; zwraca jednorazowy link (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Zaproszenie z tokenem, pokazywanym tylko raz
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - { name: invitationId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Odwołuje zaproszenie; ponowne odwołanie też daje 204
      responses:
        "204": { description: Odwołane }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /invitations/preview:
    post:
      tags: [invitations]
      operationId: previewInvitation
      summary: Co kryje link zaproszenia (bez logowania)
      description: Nieznany i odwołany token daje 404; zużyty i wygasły 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationToken" }
      responses:
        "200":
          description: Zaproszenie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Przyjęcie zaproszenia przez zalogowanego człowieka
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationToken" }
      responses:
        "200":
          description: Gospodarstwo, do którego dołączono
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /invitations/register:
    post:
      tags: [invitations]
      operationId: registerWithInvitation
      summary: Zakłada konto lokalne na zaproszony e-mail, przyjmuje zaproszenie i loguje
      description: E-mail, który ma już konto, daje 409 duplicate-email — wtedy należy się zalogować i przyjąć zaproszenie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationRegister" }
      responses:
        "201":
          description: Konto utworzone, sesja w cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registered" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /households/{householdId}/bots:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [bots]
      operationId: listBots
      summary: Boty — owner i admin widzą wszystkie, pozostali własne
      responses:
        "200":
          description: Boty według nazwy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [bots]
      operationId: createBot
      summary: Tworzy bota (owner, admin, member); token pokazywany raz
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotCreate" }
      responses:
        "201":
          description: Bot z tokenem
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotWithToken" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /households/{householdId}/bots/{botId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/BotId"
    get:
      tags: [bots]
      operationId: getBot
      responses:
        "200":
          description: Bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bot" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [bots]
      operationId: updateBot
      summary: Zmienia nazwę, scope'y, portfele, wygaśnięcie lub wyłącza bota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotUpdate" }
      responses:
        "200":
          description: Zmieniony bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bot" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [bots]
      operationId: deleteBot
      summary: Usuwa bota; jego token przestaje działać
      responses:
        "204": { description: Usunięty }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /households/{householdId}/bots/{botId}/token:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/BotId"
    post:
      tags: [bots]
      operationId: rotateBotToken
      summary: Wymienia token bota; stary przestaje działać natychmiast
      responses:
        "200":
          description: Bot z nowym tokenem
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotWithToken" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /households/{householdId}/audit:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [audit]
      operationId: listAudit
      summary: Dziennik zmian od najnowszych (owner, admin)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: actor_kind, in: query, schema: { $ref: "#/components/schemas/ActorKind" } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
      responses:
        "200":
          description: Strona dziennika
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /households/{householdId}/wallets:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [wallets]
      operationId: listWallets
      summary: Portfele widoczne dla wywołującego, z saldami (wallets:read)
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Portfele według nazwy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [wallets]
      operationId: createWallet
      summary: Tworzy portfel (wallets:write); saldo otwarcia staje się pierwszą transakcją
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletCreate" }
      responses:
        "201":
          description: Portfel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /households/{householdId}/wallets/{walletId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/WalletId"
    get:
      tags: [wallets]
      operationId: getWallet
      responses:
        "200":
          description: Portfel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [wallets]
      operationId: updateWallet
      summary: Zmienia portfel; widoczność i członków zmienia tylko człowiek (twórca, a dla shared także owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletUpdate" }
      responses:
        "200":
          description: Zmieniony portfel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

