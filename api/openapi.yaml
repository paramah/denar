      required: [amount, currency, minor]
      properties:
        amount: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", examples: ["-12.34"] }
        currency: { type: string, description: Kod ISO 4217 }
        minor: { type: integer, format: int64 }
    MoneyInput:
      type: object
      description: Kwota na wejściu; waluta musi być walutą portfela (inaczej 422)
      required: [amount, currency]
      properties:
        amount: { type: string, examples: ["12.34"] }
        currency: { type: string }
